services:
  go-link:
    build:
      context: .
      target: runtime
    environment:
      APP_PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-valkey:6379}
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  valkey-data:
